<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fivefold</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef3;--ink:#1b2a41;--tile:#ffffff;--line:#b9c4d0;--hit:#2f7d5b;--near:#c98a1f;--miss:#78879a;--key:#d1dae4;--on:#ffffff;--card:#ffffff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16202e;--ink:#e6edf5;--tile:#1f2c3d;--line:#3a4a5f;--hit:#3d9a72;--near:#b98324;--miss:#4a5667;--key:#2c3b50;--card:#1f2c3d}}
:root[data-theme="dark"]{--bg:#16202e;--ink:#e6edf5;--tile:#1f2c3d;--line:#3a4a5f;--hit:#3d9a72;--near:#b98324;--miss:#4a5667;--key:#2c3b50;--card:#1f2c3d}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;box-sizing:border-box;overflow-x:hidden;transition:background .25s,color .25s}
button{font-family:inherit;color:inherit}
h1{margin:0;font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.02em}
.sub{margin:0;font-size:14px;opacity:.75;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;width:min(100%,420px)}
.seg{display:flex;border:2px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;font-weight:700;font-size:14px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;gap:6px}
.tb{border:2px solid var(--line);background:transparent;border-radius:8px;font-weight:700;font-size:14px;padding:6px 12px;cursor:pointer}
#msg{min-height:24px;font-weight:700;font-size:16px;text-align:center}
#board{display:grid;gap:6px;--t:min(14vw,6.8vh,64px)}
.row{display:grid;grid-template-columns:repeat(5,var(--t));gap:6px}
.tile{height:var(--t);display:flex;align-items:center;justify-content:center;font-size:calc(var(--t)*.55);font-weight:800;background:var(--tile);border:2px solid var(--line);border-bottom-width:5px;border-radius:6px;box-sizing:border-box;text-transform:uppercase}
.tile.filled{border-color:var(--ink);animation:pop .1s}
.tile.hit,.tile.near,.tile.miss{color:var(--on);border-color:transparent;border-bottom-color:rgba(0,0,0,.25)}
.tile.hit{background:var(--hit)}.tile.near{background:var(--near)}.tile.miss{background:var(--miss)}
.tile.flip{animation:flip .5s}
.row.shake{animation:shake .4s}
#kb{display:flex;flex-direction:column;gap:6px;width:min(100%,500px)}
.krow{display:flex;justify-content:center;gap:5px}
.key{flex:1;max-width:44px;height:50px;border:0;border-radius:6px;background:var(--key);font-weight:700;font-size:15px;cursor:pointer;padding:0;transition:background .3s,transform .08s}
.key.wide{flex:1.6;max-width:68px;font-size:13px}
.key:active{transform:scale(.9)}
.key.press{animation:kp .15s}
.key.upd{animation:kupd .45s}
.key.hit,.key.near,.key.miss{color:var(--on)}
.key.hit{background:var(--hit)}.key.near{background:var(--near)}.key.miss{background:var(--miss)}
button:focus-visible{outline:3px solid var(--near);outline-offset:2px}
.pill{border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;border-radius:8px;padding:10px 18px;cursor:pointer}
.pill.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
#modal{position:fixed;inset:0;background:rgba(10,16,26,.6);display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;z-index:5}
#modal[hidden]{display:none}
.card{background:var(--card);border-radius:14px;width:min(100%,400px);max-height:92%;overflow:auto;padding:20px;box-sizing:border-box;animation:rise .25s}
.card h2{margin:0 0 2px;font-size:26px;font-weight:800;letter-spacing:-.01em}
.card p{margin:0 0 12px;font-size:15px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-bottom:14px}
.grid b{display:block;font-size:26px;font-weight:800}
.grid span{font-size:12px;opacity:.75}
.dist{display:grid;grid-template-columns:14px 1fr;gap:4px 8px;align-items:center;margin-bottom:14px;font-size:13px;font-weight:700}
.dist i{display:block;background:var(--miss);color:var(--on);font-style:normal;padding:1px 6px;border-radius:3px;min-width:18px;box-sizing:border-box;text-align:right}
.dist i.me{background:var(--hit)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
#sh{display:block;width:100%;height:96px;margin-bottom:10px;font:14px/1.3 system-ui,sans-serif;box-sizing:border-box}
#sh[hidden]{display:none}
#cp{font-size:13px;min-height:18px;margin:8px 0 0}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes flip{50%{transform:rotateX(90deg)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes kp{50%{transform:scale(.86)}}
@keyframes kupd{40%{transform:translateY(-5px) scale(1.1)}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1>Fivefold</h1>
<p class="sub" id="sub"></p>
<div class="bar">
  <div class="seg" role="group" aria-label="Game mode"><button type="button" id="mDaily" aria-pressed="true">Daily</button><button type="button" id="mPractice" aria-pressed="false">Practice</button></div>
  <div class="tools"><button type="button" class="tb" id="bStats">Stats</button><button type="button" class="tb" id="bTheme">Dark mode</button></div>
</div>
<div id="msg" role="status" aria-live="polite"></div>
<div id="board" aria-label="Guess board"></div>
<button type="button" class="pill" id="newWord" hidden>New word</button>
<div id="kb"></div>

<div id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <p id="mSub"></p>
    <div class="grid" id="mGrid"></div>
    <div class="dist" id="mDist" aria-label="Guess distribution"></div>
    <textarea id="sh" readonly hidden aria-label="Result text to copy"></textarea>
    <div class="acts">
      <button type="button" class="pill" id="bShare">Share result</button>
      <button type="button" class="pill alt" id="bAgain"></button>
      <button type="button" class="pill alt" id="mClose">Close</button>
    </div>
    <p id="cp" role="status"></p>
    <p id="nx"></p>
  </div>
</div>

<script>
var Logic=(function(){
function pad(n){return String(n).padStart(2,"0")}
function score(g,a){
  var r=["miss","miss","miss","miss","miss"],p={},i;
  for(i=0;i<5;i++){if(g[i]===a[i])r[i]="hit";else p[a[i]]=(p[a[i]]||0)+1}
  for(i=0;i<5;i++){if(r[i]!=="hit"&&p[g[i]]>0){r[i]="near";p[g[i]]--}}
  return r;
}
function dateKey(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function dayNum(k){var p=k.split("-").map(Number);return Math.floor(Date.UTC(p[0],p[1]-1,p[2])/864e5)}
function prevDay(k){var d=new Date((dayNum(k)-1)*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var cache=null;
function order(list){
  if(cache&&cache.n===list.length&&cache.f===list[0])return cache.a;
  var a=list.slice(),r=rng(20260101),i,j,t;
  for(i=a.length-1;i>0;i--){j=Math.floor(r()*(i+1));t=a[i];a[i]=a[j];a[j]=t}
  cache={n:list.length,f:list[0],a:a};return a;
}
function daily(list,k){var o=order(list),n=dayNum(k)-dayNum("2026-01-01");return o[((n%o.length)+o.length)%o.length]}
function blank(){return{p:0,w:0,cur:0,max:0,last:"",dist:[0,0,0,0,0,0]}}
function record(s,won,n,k,isDaily){
  var o=Object.assign(blank(),s||{});
  o.dist=(Array.isArray(o.dist)?o.dist:[]).concat([0,0,0,0,0,0]).slice(0,6);
  if(isDaily&&o.last===k)return o;
  o.p++;
  if(won){o.w++;o.dist[n-1]++;o.cur=isDaily?(o.last===prevDay(k)?o.cur+1:1):o.cur+1;o.max=Math.max(o.max,o.cur)}
  else o.cur=0;
  if(isDaily)o.last=k;
  return o;
}
var EM={hit:"\u{1F7E9}",near:"\u{1F7E8}",miss:"\u2B1B"};
function share(rows,won,title){
  return title+" "+(won?rows.length:"X")+"/6\n"+rows.map(function(r){return r.map(function(c){return EM[c]}).join("")}).join("\n");
}
return{score:score,dateKey:dateKey,dayNum:dayNum,prevDay:prevDay,daily:daily,order:order,blank:blank,record:record,share:share};
})();
if(typeof module!=="undefined")module.exports=Logic;

(function(){
var L=Logic,ANS=WORDS.split(" "),DICT=new Set(DICTSTR.match(/.{5}/g));
ANS.forEach(function(w){DICT.add(w)});
var $=function(i){return document.getElementById(i)};
var board=$("board"),kb=$("kb"),msg=$("msg"),modal=$("modal"),root=document.documentElement;
var rank={miss:1,near:2,hit:3},S={},lastWord="";
var canSave=(function(){try{localStorage.setItem("fivefold:t","1");localStorage.removeItem("fivefold:t");return true}catch(e){return false}})();
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function allStats(){
  var s=store("fivefold:stats");
  if(!s||typeof s!=="object"){
    var o=store("fivefold");
    s={daily:L.blank(),practice:(o&&typeof o.p==="number")?Object.assign(L.blank(),{p:o.p,w:o.w||0,cur:o.s||0,max:o.s||0}):L.blank()};
  }
  s.daily=Object.assign(L.blank(),s.daily);s.practice=Object.assign(L.blank(),s.practice);
  return s;
}
function say(t){msg.textContent=t}
function won(){return S.guesses.length>0&&S.guesses[S.guesses.length-1]===S.answer}

function mk(l,c){var b=document.createElement("button");b.type="button";b.textContent=l;b.dataset.k=l;b.className="key "+(c||"");b.setAttribute("aria-label",l==="\u232B"?"Delete":l);b.onclick=function(){press(l)};return b}
function build(){
  board.innerHTML="";kb.innerHTML="";
  for(var r=0;r<6;r++){var d=document.createElement("div");d.className="row";for(var c=0;c<5;c++){var t=document.createElement("div");t.className="tile";d.appendChild(t)}board.appendChild(d)}
  ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"].forEach(function(s,i){
    var d=document.createElement("div");d.className="krow";
    if(i===2)d.appendChild(mk("Enter","wide"));
    s.split("").forEach(function(l){d.appendChild(mk(l))});
    if(i===2)d.appendChild(mk("\u232B","wide"));
    kb.appendChild(d);
  });
}
function colorKey(l,c){
  var e=kb.querySelector('[data-k="'+l+'"]');
  if(e&&rank[c]>(S.ks[l]||0)){S.ks[l]=rank[c];e.classList.remove("miss","near","hit","upd");void e.offsetWidth;e.classList.add(c,"upd")}
}
function flash(k){
  var e=kb.querySelector('[data-k="'+k+'"]');
  if(e){e.classList.remove("press");void e.offsetWidth;e.classList.add("press")}
}
function paint(r,g,res,anim,done){
  var ts=board.children[r].children;
  for(var i=0;i<5;i++)(function(i){
    ts[i].textContent=g[i];ts[i].classList.add("filled");
    var go=function(){ts[i].classList.add(res[i]);colorKey(g[i],res[i])};
    if(anim)setTimeout(function(){ts[i].classList.add("flip");setTimeout(go,250)},i*280);else go();
  })(i);
  if(anim)setTimeout(done,5*280+300);
}
function tiles(){return board.children[S.guesses.length].children}
function shake(){var r=board.children[S.guesses.length];r.classList.remove("shake");void r.offsetWidth;r.classList.add("shake")}

function recordResult(){
  var all=allStats(),daily=S.mode==="daily";
  all[S.mode]=L.record(all[S.mode],won(),S.guesses.length,S.key,daily);
  store("fivefold:stats",all);
}
function endMsg(){
  say(won()?(S.guesses.length===1?"First try. Remarkable.":"Solved in "+S.guesses.length+" of 6."):"Out of tries. The word was "+S.answer+".");
}
function finish(){S.over=true;recordResult();endMsg();setTimeout(function(){openModal()},700)}

function newGame(mode){
  S={mode:mode,guesses:[],cur:"",over:false,busy:false,ks:{},key:L.dateKey()};
  if(mode==="daily")S.answer=L.daily(ANS,S.key);
  else{var w;do{w=ANS[Math.floor(Math.random()*ANS.length)]}while(w===lastWord);lastWord=w;S.answer=w}
  build();say("");
  $("newWord").hidden=mode!=="practice";
  $("mDaily").setAttribute("aria-pressed",mode==="daily");$("mPractice").setAttribute("aria-pressed",mode!=="daily");
  $("sub").textContent=mode==="daily"?"Daily puzzle for "+S.key+". One word, one shot.":"Practice round. Play as many as you like.";
  if(mode==="daily"){
    var sv=store("fivefold:daily");
    if(sv&&sv.k===S.key&&Array.isArray(sv.g)){
      sv.g.slice(0,6).forEach(function(g){
        if(typeof g==="string"&&/^[A-Z]{5}$/.test(g)&&!S.over){var r=S.guesses.length;S.guesses.push(g);paint(r,g,L.score(g,S.answer),false);if(won()||S.guesses.length===6)S.over=true}
      });
      if(S.over){recordResult();endMsg()}
    }
  }
}

function press(k){
  if(!modal.hidden||S.over||S.busy)return;
  if(k==="Enter"){flash("Enter");return submit()}
  if(k==="\u232B"||k==="Backspace"){flash("\u232B");if(S.cur.length){S.cur=S.cur.slice(0,-1);var t=tiles()[S.cur.length];t.textContent="";t.classList.remove("filled")}return}
  if(/^[A-Za-z]$/.test(k)&&S.cur.length<5){k=k.toUpperCase();flash(k);var t2=tiles()[S.cur.length];t2.textContent=k;t2.classList.add("filled");S.cur+=k;say("")}
}
function submit(){
  var g=S.cur;
  if(g.length<5){say("Type five letters first.");return shake()}
  if(!DICT.has(g)){say("Not in the word list.");return shake()}
  var r=S.guesses.length,res=L.score(g,S.answer);
  S.guesses.push(g);S.cur="";S.busy=true;
  if(S.mode==="daily")store("fivefold:daily",{k:S.key,g:S.guesses});
  paint(r,g,res,true,function(){S.busy=false;if(g===S.answer||S.guesses.length===6)finish()});
}

function openModal(){
  var st=allStats()[S.mode],n=S.guesses.length,done=S.over,w=won();
  $("mTitle").textContent=!done?"Statistics":w?(n===1?"First try":"Solved in "+n+" of 6"):"Out of tries";
  $("mSub").textContent=done?(w?"Nice work.":"The word was "+S.answer+"."):(S.mode==="daily"?"Daily puzzle results.":"Practice results.");
  var pct=st.p?Math.round(100*st.w/st.p):0;
  $("mGrid").innerHTML=[[st.p,"Played"],[pct+"%","Win rate"],[st.cur,"Streak"],[st.max,"Best"]].map(function(x){return"<div><b>"+x[0]+"</b><span>"+x[1]+"</span></div>"}).join("");
  var mx=Math.max.apply(null,st.dist.concat([1]));
  $("mDist").innerHTML=st.dist.map(function(v,i){return"<div>"+(i+1)+"</div><div><i class='"+(done&&w&&n===i+1?"me":"")+"' style='display:block;width:"+Math.max(8,Math.round(100*v/mx))+"%'>"+v+"</i></div>"}).join("");
  $("bShare").hidden=!done;$("sh").hidden=true;$("cp").textContent="";
  $("bAgain").textContent=S.mode==="daily"?"Play practice":"New word";
  var nx=$("nx");
  if(S.mode==="daily"&&done){var m=new Date();var left=new Date(m.getFullYear(),m.getMonth(),m.getDate()+1)-m;nx.textContent="Next daily puzzle in "+Math.floor(left/36e5)+"h "+Math.floor(left%36e5/6e4)+"m.";}
  else nx.textContent=canSave?"":"Stats can’t be saved in this browser, so they will reset when you leave.";
  modal.hidden=false;$("mClose").focus();
}
function closeModal(){modal.hidden=true}
function shareText(){
  var rows=S.guesses.map(function(g){return L.score(g,S.answer)});
  return L.share(rows,won(),"Fivefold "+(S.mode==="daily"?"Daily "+S.key:"Practice"));
}
function legacy(t){try{var a=$("sh");a.hidden=false;a.value=t;a.select();var ok=document.execCommand("copy");if(ok)a.hidden=true;return ok}catch(e){return false}}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).then(function(){return true},function(){return legacy(t)});
  return Promise.resolve(legacy(t));
}
$("bShare").onclick=function(){copy(shareText()).then(function(ok){$("cp").textContent=ok?"Copied to clipboard.":"Select the text above and copy it."})};
$("bAgain").onclick=function(){closeModal();newGame("practice")};
$("mClose").onclick=closeModal;
modal.addEventListener("click",function(e){if(e.target===modal)closeModal()});
$("bStats").onclick=openModal;
$("newWord").onclick=function(){newGame("practice")};
$("mDaily").onclick=function(){if(S.mode!=="daily")newGame("daily")};
$("mPractice").onclick=function(){if(S.mode!=="practice")newGame("practice")};

function applyTheme(t){root.setAttribute("data-theme",t);$("bTheme").textContent=t==="dark"?"Light mode":"Dark mode"}
applyTheme(store("fivefold:theme")||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("bTheme").onclick=function(){var t=root.getAttribute("data-theme")==="dark"?"light":"dark";applyTheme(t);store("fivefold:theme",t)};

document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button");if(b&&modal.hidden)b.blur()});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&!modal.hidden)return closeModal();
  if(e.ctrlKey||e.metaKey||e.altKey||!modal.hidden)return;
  var tg=e.target;if(tg&&tg.tagName==="BUTTON"&&!tg.classList.contains("key"))return;
  if(e.key==="Enter"||e.key==="Backspace"||/^[a-zA-Z]$/.test(e.key)){e.preventDefault();press(e.key)}
});
newGame("daily");
})();
</script>
